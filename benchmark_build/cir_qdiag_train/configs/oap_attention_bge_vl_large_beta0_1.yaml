experiment:
  name: oap_attention_bge_vl_large_beta0_1
  seed: 42
  output_dir: outputs/oap_attention/bge_vl_large/beta0_1

data:
  train_manifest: data/cirr_train_all_v5_no_va.jsonl
  val_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.val.json
  val_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.val.json
  image_root: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR
  max_negatives_per_semantic: 2
  num_workers: 8

model:
  architecture: attention_tokens
  variant: bge_vl_large
  pretrained_model_name_or_path: ../../CIR_PLAY/models/checkpoints/BGE-VL-large
  base_checkpoint: outputs/bge_vl_large/full/hard_w0_1/checkpoint_epoch_010.pt
  local_files_only: true
  trust_remote_code: true
  base_hidden_dim: 1024
  base_dropout: 0.1
  base_temperature: 0.07
  base_learnable_temperature: true
  semantic_dim: 64
  attention_hidden_dim: 256
  attention_num_heads: 8
  attention_ffn_dim: 512
  attention_dropout: 0.1
  beta: 0.1

optimizer:
  epochs: 5
  batch_size_per_gpu: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  ordering_temperature: 0.07
  retrieval_margin: 0.0
  patch_margin: 0.01
  mixed_precision: bf16
  log_every_steps: 50
  save_every_epochs: 2

evaluation:
  batch_size: 128
  recall_k: [1, 5, 10, 50]
  group_recall_k: [1, 2, 3]
