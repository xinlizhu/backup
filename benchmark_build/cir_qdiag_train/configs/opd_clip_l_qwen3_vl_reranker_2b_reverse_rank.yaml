experiment:
  name: clip_l_original_opd_reverse_rank_from_qwen3_vl_reranker_2b
  seed: 42
  output_dir: outputs/opd_reranker_teacher/clip_l_from_qwen3_vl_reranker_2b_reverse_kl

data:
  train_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.train.json
  train_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.train.json
  val_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.val.json
  val_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.val.json
  image_root: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR
  teacher_cache_dir: null
  num_workers: 8

model:
  variant: clip_vit_l14
  pretrained_model_name_or_path: models/clip-vit-large-patch14
  local_files_only: true
  trust_remote_code: false
  hidden_dim: 1024
  dropout: 0.1
  freeze_backbone: false
  freeze_vision_encoder: false
  unfreeze_last_n_layers: null
  lora_rank: null
  gradient_checkpointing: true

objective:
  loss_type: rank_kd
  rank_weight: 1.0
  centered_response_weight: 0.0
  rank_temperature: 0.05
  rank_kl_direction: reverse
  centered_response_beta: 0.01
  require_teacher_target_top1: false
  teacher_target_max_rank: 10

teacher:
  backend: http_reranker
  endpoint_url: http://interactive-kefnm35z3lpc:8001/v1/score
  model_name: qwen3-vl-reranker-2b
  api_format: score
  instruction: null
  image_transport: data_url
  max_concurrent_requests: 8
  request_timeout_seconds: 300
  max_retries: 5
  retry_backoff_seconds: 2

mining:
  top_k: 32
  candidate_source: student
  refresh_mode: every_epoch
  refresh_every_epochs: 1
  image_batch_size: 512
  query_batch_size: 1024
  teacher_score_batch_size: 512
  cache_dtype: float32

optimizer:
  epochs: 4
  batch_size_per_gpu: 32
  live_image_batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  backbone_learning_rate: 0.0000005
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  temperature: 0.07
  learnable_temperature: false
  mixed_precision: bf16
  log_every_steps: 20
  save_every_epochs: 1

evaluation:
  batch_size: 256
  recall_k: [1, 5, 10, 50]
  group_recall_k: [1, 2, 3]
