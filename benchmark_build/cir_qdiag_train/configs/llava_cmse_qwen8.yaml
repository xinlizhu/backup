experiment:
  name: llava_cmse_qwen8
  seed: 42
  output_dir: outputs/llava_lora_2gpu_b32_gc8_e2/llava_cmse_qwen8
data:
  num_workers: 8
  prefetch_factor: 1
  train_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.train.json
  train_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.train.json
  val_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.val.json
  val_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.val.json
  image_root: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR
  teacher_cache_dir: outputs/opd_student_teacher_matrix/cache/qwen3_vl_embedding_8b_cirr_train
  student_gallery_cache_dir: null
model:
  variant: llava_shared_lora
  pretrained_model_name_or_path: /mnt/data/datasets/search_dataset/zxl/llava/llava-v1.6-mistral-7b-hf
  local_files_only: true
  trust_remote_code: false
  lora_target_modules: attention
  lora_rank: 16
  lora_alpha: 32.0
  lora_dropout: 0.05
  gradient_checkpointing: true
  max_length: 8192
  llava_image_size: 512
  min_pixels: 4096
  max_pixels: 262144
objective:
  loss_type: centered_mse
  rank_weight: 0.0
  centered_response_weight: 0.0
  rank_temperature: 0.05
  rank_kl_direction: reverse
  centered_response_beta: 0.01
  require_teacher_target_top1: false
  teacher_target_max_rank: null
mining:
  top_k: 32
  force_target_insertion: true
  candidate_source: random
  refresh_mode: every_epoch
  refresh_every_epochs: 1
  image_batch_size: 16
  query_batch_size: 16
  teacher_score_batch_size: 512
  cache_dtype: float16
optimizer:
  epochs: 2
  world_size: 2
  batch_size_per_gpu: 16
  gradient_accumulation_steps: 1
  candidate_encode_batch_size: 8
  candidate_gradient_cache: true
  learning_rate: 5.0e-06
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  mixed_precision: bf16
  log_every_steps: 20
  save_every_epochs: 1
evaluation:
  batch_size: 16
  num_workers: 16
  prefetch_factor: 2
  pin_memory: true
  recall_k:
  - 1
  - 5
  - 10
  - 50
  group_recall_k:
  - 1
  - 2
  - 3
