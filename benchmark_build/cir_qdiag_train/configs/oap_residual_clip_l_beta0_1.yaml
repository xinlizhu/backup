experiment:
  name: oap_residual_clip_l_beta0_1
  seed: 42
  output_dir: outputs/oap_residual/clip_l/beta0_1

data:
  train_manifest: data/cirr_train_all_v5_no_va.jsonl
  val_annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.val.json
  val_image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.val.json
  image_root: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR
  max_negatives_per_semantic: 2
  num_workers: 8

model:
  architecture: residual_adapter
  variant: clip_vit_l14
  pretrained_model_name_or_path: models/clip-vit-large-patch14
  base_checkpoint: outputs/clip_l/full/baseline/checkpoint_epoch_010.pt
  local_files_only: true
  trust_remote_code: false
  base_hidden_dim: 1024
  base_dropout: 0.1
  base_temperature: 0.07
  base_learnable_temperature: true
  semantic_hidden_dim: 128
  semantic_dim: 64
  beta: 0.1

optimizer:
  epochs: 5
  batch_size_per_gpu: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  ordering_temperature: 0.07
  retrieval_margin: 0.0
  patch_margin: 0.01
  mixed_precision: bf16
  log_every_steps: 50
  save_every_epochs: 2

evaluation:
  batch_size: 128
  recall_k: [1, 5, 10, 50]
  group_recall_k: [1, 2, 3]
