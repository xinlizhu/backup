data:
  annotation_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/captions/cap.rc2.val.json
  image_split_path: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR/cirr/image_splits/split.rc2.val.json
  image_root: /mnt/data/datasets/search_dataset/zxl/CIR_new/datasets/CIRR
  split: val

sampling:
  limit: 500
  seed: 42
  strategy: hybrid
  random_count: 300
  targeted_count: 200

model:
  backend: vllm
  name: qwen3.6-27b
  name_or_path: /mnt/data/datasets/search_dataset/zxl/QW/Qwen3.6-27B
  api_base: http://127.0.0.1:8000/v1
  api_key: EMPTY
  device: cuda
  dtype: bfloat16
  trust_remote_code: false
  timeout_seconds: 300
  max_retries: 2
  disable_thinking: true
  mm_processor_kwargs:
    max_pixels: 4194304

screening:
  temperature: 0.0
  max_new_tokens: 1024

generation:
  temperature: 0.0
  max_new_tokens: 2048

selection:
  temperature: 0.0
  max_new_tokens: 4096

runtime:
  output_dir: outputs/pilot_500_v5
  prompt_version: v5
  resume: true
  max_workers: 8
